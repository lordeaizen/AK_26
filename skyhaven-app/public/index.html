<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<title>Skyhaven — research build</title>
		<link rel="stylesheet" href="/styles.css" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪁</text></svg>" />
	</head>
	<body>
		<div id="app">
			<header id="hud">
				<div class="hud-left">
					<span class="logo">Skyhaven</span>
					<span id="hud-title"></span>
					<span id="hud-sub"></span>
				</div>
				<div class="hud-right">
					<span id="session-tag" class="tag"></span>
				</div>
				<div id="progress"><div id="progress-fill"></div></div>
			</header>

			<main id="stage"></main>

			<footer id="foot">
				<button id="stop-btn" class="btn tiny ghost no-capture">I want to stop</button>
				<span class="foot-note">Research instrument · schematic stimuli · not a diagnostic tool</span>
			</footer>
		</div>

		<script src="/js/core.js"></script>
		<script src="/js/vignettes.js"></script>
		<script src="/js/tasks-cognitive.js"></script>
		<script src="/js/tasks-frustration.js"></script>
		<script src="/js/tasks-social.js"></script>
		<script src="/js/app.js"></script>
	</body>
</html>
